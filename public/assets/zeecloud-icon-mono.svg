<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Monochrome version — works on any background colour -->
  <!-- Pentagon frame edges (non-Z) -->
  <line x1="50" y1="12" x2="86" y2="38" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <line x1="86" y1="38" x2="72" y2="81" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <line x1="28" y1="81" x2="14" y2="38" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <line x1="14" y1="38" x2="50" y2="12" stroke="currentColor" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <!-- Z -->
  <line x1="14" y1="38" x2="86" y2="38" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="86" y1="38" x2="28" y2="81" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="28" y1="81" x2="72" y2="81" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="50" cy="12" r="4" fill="currentColor" opacity="0.6"/>
  <circle cx="86" cy="38" r="5" fill="currentColor"/>
  <circle cx="72" cy="81" r="5" fill="currentColor"/>
  <circle cx="28" cy="81" r="5" fill="currentColor"/>
  <circle cx="14" cy="38" r="5" fill="currentColor"/>
</svg>
