<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zg" x1="14" y1="81" x2="86" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d2fb5"/>
      <stop offset="55%"  stop-color="#1a5af5"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pentagon frame (non-Z edges) — slightly thinner/dimmer so Z reads first -->
  <line x1="50" y1="12" x2="86" y2="38" stroke="url(#zg)" stroke-width="1.2" opacity="0.28" stroke-linecap="round"/>
  <line x1="86" y1="38" x2="72" y2="81" stroke="url(#zg)" stroke-width="1.2" opacity="0.28" stroke-linecap="round"/>
  <line x1="28" y1="81" x2="14" y2="38" stroke="url(#zg)" stroke-width="1.2" opacity="0.28" stroke-linecap="round"/>
  <line x1="14" y1="38" x2="50" y2="12" stroke="url(#zg)" stroke-width="1.2" opacity="0.28" stroke-linecap="round"/>

  <!-- Z: bolder, brighter — reads immediately -->
  <line x1="14" y1="38" x2="86" y2="38" stroke="url(#zg)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="86" y1="38" x2="28" y2="81" stroke="url(#zg)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="28" y1="81" x2="72" y2="81" stroke="url(#zg)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Nodes — larger for visibility at small sizes -->
  <circle cx="50" cy="12" r="5"   fill="white"    opacity="0.9"  filter="url(#glow)"/>
  <circle cx="86" cy="38" r="6.5" fill="url(#zg)" filter="url(#glow)"/>
  <circle cx="72" cy="81" r="6.5" fill="url(#zg)" filter="url(#glow)"/>
  <circle cx="28" cy="81" r="6.5" fill="url(#zg)" filter="url(#glow)"/>
  <circle cx="14" cy="38" r="6.5" fill="url(#zg)" filter="url(#glow)"/>
</svg>
